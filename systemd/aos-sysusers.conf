# scoped groups and non-login service users; no broad device or sudo membership.
g aos-state -
g aos-control -
g aos-inbox -
g aos-bridge-auth -
g aos-display-auth -
g aos-muse-auth -
g aos-mcp-auth -
u aos-bridge - "aOS state writer" /var/lib/aos /usr/sbin/nologin
u aos-mcp - "aOS MCP proxy" /nonexistent /usr/sbin/nologin
u aos-display - "aOS native display" /nonexistent /usr/sbin/nologin
u aos-cec - "aOS CEC adapter" /nonexistent /usr/sbin/nologin
u aos-muse - "aOS optional Muse executor" /var/lib/aos-muse /usr/sbin/nologin
m aos-bridge aos-state
m aos-display aos-state
m aos-bridge aos-control
m aos-cec aos-control
m aos-bridge aos-inbox
m aos-muse aos-inbox
m aos-bridge aos-bridge-auth
m aos-mcp aos-bridge-auth
m aos-bridge aos-display-auth
m aos-display aos-display-auth
m aos-bridge aos-muse-auth
m aos-muse aos-muse-auth
m aos-mcp aos-mcp-auth
